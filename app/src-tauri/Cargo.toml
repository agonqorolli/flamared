[package]
name = "flamared"
version = "1.0.0"
description = "Check the code changes AI coding agents make"
authors = ["agonqorolli"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The binary's name is what macOS shows in the menu bar and Dock when running `pnpm tauri dev`, so it carries the
# app's visible name; the package and identifiers stay lowercase.
[[bin]]
name = "Flamared"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1.13.1"
indexmap = { version = "2.14.2", features = ["serde"] }
chrono = "0.4.45"
notify = "8.2.1"
notify-debouncer-mini = "0.7.0"
tauri-plugin-dialog = "2.8.4"
ed25519-dalek = "3.0.0"
base64 = "0.23.1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
